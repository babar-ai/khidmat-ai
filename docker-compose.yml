services:

  db:
    image: postgis/postgis:16-3.4
    container_name: kidmat_db

    environment:
      POSTGRES_USER: kidmat_user
      POSTGRES_PASSWORD: kidmat_pass
      POSTGRES_DB: kidmat_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidmat_user -d kidmat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: kidmat_backend

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: